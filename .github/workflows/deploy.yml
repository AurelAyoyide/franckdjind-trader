name: Deploy BonoTrading

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -eu

            ROOT="/var/www/bonotrading"
            REPO="$ROOT/repo"
            TARGET_COMMIT="${{ github.sha }}"

            cd "$ROOT"

            echo "Récupération du commit $TARGET_COMMIT..."
            git -C "$REPO" fetch --prune origin main

            OLD_COMMIT=$(git -C "$REPO" rev-parse HEAD)
            echo "Ancien commit VPS : $OLD_COMMIT"
            echo "Nouveau commit     : $TARGET_COMMIT"

            DEPLOY_BLOG=false
            DEPLOY_SCHOOL=false

            if git -C "$REPO" cat-file -e "${OLD_COMMIT}^{commit}" 2>/dev/null \
              && git -C "$REPO" cat-file -e "${TARGET_COMMIT}^{commit}" 2>/dev/null; then

              CHANGED=$(git -C "$REPO" diff --name-only "$OLD_COMMIT" "$TARGET_COMMIT" || true)

              echo "Fichiers modifiés :"
              printf '%s\n' "$CHANGED"

              if printf '%s\n' "$CHANGED" | grep -Eq '^blog/|^docker-compose\.blog\.yml$|^caddy/|^\.github/workflows/deploy\.yml$'; then
                DEPLOY_BLOG=true
              fi

              if printf '%s\n' "$CHANGED" | grep -Eq '^school/|^docker-compose\.school\.yml$|^caddy/|^\.github/workflows/deploy\.yml$'; then
                DEPLOY_SCHOOL=true
              fi
            else
              echo "Comparaison impossible : déploiement complet par sécurité."
              DEPLOY_BLOG=true
              DEPLOY_SCHOOL=true
            fi

            echo "Alignement du VPS sur GitHub..."
            git -C "$REPO" reset --hard "$TARGET_COMMIT"

            if [ "$DEPLOY_BLOG" = true ]; then
              echo "=== Déploiement Blog ==="
              docker compose -f docker-compose.blog.yml build blog-app
              docker compose -f docker-compose.blog.yml up -d --force-recreate blog-app
            else
              echo "Aucune modification Blog détectée."
            fi

            if [ "$DEPLOY_SCHOOL" = true ]; then
              echo "=== Déploiement School ==="
              docker compose -f docker-compose.school.yml build school-app
              docker compose -f docker-compose.school.yml up -d --force-recreate school-app

              SCHOOL_CONTAINER=$(docker compose -f docker-compose.school.yml ps -q school-app)
              test -n "$SCHOOL_CONTAINER"

              docker inspect \
                --format='School démarré à {{.State.StartedAt}} avec l’image {{.Image}}' \
                "$SCHOOL_CONTAINER"
            else
              echo "Aucune modification School détectée."
            fi

            check_url() {
              URL="$1"

              for i in $(seq 1 30); do
                if curl --connect-timeout 10 --max-time 20 -fsS "$URL" >/dev/null; then
                  echo "$URL répond correctement."
                  return 0
                fi

                echo "Attente de $URL — tentative $i/30..."
                sleep 5
              done

              echo "Échec : $URL ne répond toujours pas."
              return 1
            }

            if [ "$DEPLOY_BLOG" = true ]; then
              check_url "https://blog.bonotrading.com"
            fi

            if [ "$DEPLOY_SCHOOL" = true ]; then
              check_url "https://school.bonotrading.com"
            fi

            echo "Déploiement terminé avec succès."
